name: Sync NCS Catalog

on:
  schedule:
    # Every 4 hours - picks up new NCS releases automatically
    - cron: '23 */4 * * *'
  workflow_dispatch:
    inputs:
      pages:
        description: 'Number of latest pages to check (default 6)'
        required: false
        default: '6'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run incremental sync
        env:
          NCS_SYNC_PAGES: ${{ github.event.inputs.pages || 6 }}
        run: |
          node __sync_latest.cjs "$NCS_SYNC_PAGES"

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          if git diff --cached --quiet; then
            echo "No changes to catalog.json; nothing to commit."
          else
            git commit -m "chore: sync NCS catalog (auto)"
            git push
          fi
